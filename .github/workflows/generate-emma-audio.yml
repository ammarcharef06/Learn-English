name: Generate Emma audio bank

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - .github/workflows/generate-emma-audio.yml

permissions:
  contents: write

concurrency:
  group: emma-audio-generation-development
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Edge TTS client
        run: python -m pip install --upgrade pip edge-tts

      - name: Verify complete conversion map (dry run)
        run: npm run audio:emma:migrate

      - name: Generate and replace the complete Emma speech bank
        run: npm run audio:emma:migrate -- --write --force

      - name: Commit generated audio to development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/zero
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Generate complete Emma audio bank"
            git push origin HEAD:development
          fi
