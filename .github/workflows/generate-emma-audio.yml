name: Generate free Kokoro precision audio bank

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - .github/workflows/generate-emma-audio.yml
      - scripts/generate-kokoro-precision.py
      - scripts/generate-emma-precision.mjs
      - assets/js/core/zero-audio.js
      - package.json

permissions:
  contents: write

concurrency:
  group: precision-audio-development
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install Kokoro runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile numpy
      - name: Preview exact bank coverage
        run: npm run audio:precision:dry
      - name: Generate all precision recordings
        run: npm run audio:precision -- --write --force
      - name: Verify generated MP3 inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("assets/audio/zero")
          expected=[root/"n"/f"name-{c}.mp3" for c in "abcdefghijklmnopqrstuvwxyz"]
          expected += [root/"n"/f"word-{c}.mp3" for c in "abcdefghijklmnopqrstuvwxyz"]
          ids=["sh","ch","th-voiceless","th-voiced","ph","ck","ng","oo-long","oo-short","ee","ea","ou"]
          expected += [root/"d"/f"{x}.mp3" for x in ids]
          expected += [root/"n"/f"word-{x}.mp3" for x in ids]
          phonemes=["p","b","t","d","k","g","f","v","theta","eth","s","z","sh","ch","m","n","eng","l","r","h","w","y"]
          expected += [root/"p"/f"phoneme-{x}.mp3" for x in phonemes]
          expected += [root/"n"/f"phoneme-word-{x}.mp3" for x in phonemes]
          missing=[str(p) for p in expected if not p.exists() or p.stat().st_size<1024]
          print(f"Expected {len(expected)} files; missing/invalid: {len(missing)}")
          if missing: raise SystemExit("\\n".join(missing))
          PY
      - name: Run project checks
        run: |
          npm ci
          npm test
      - name: Commit generated bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/zero/n assets/audio/zero/d assets/audio/zero/p curriculum/literacy/audio-manifest.json curriculum/literacy/phoneme-grapheme-reference.json
          if git diff --cached --quiet; then echo "No generated audio changes."; exit 0; fi
          git commit -m "Generate free Kokoro precision audio bank"
          git fetch origin development
          git rebase origin/development
          git push origin HEAD:development
