project_id = "learn-english-community"

[functions.community-assistant]
verify_jwt = true

[auth]
additional_redirect_urls = ["com.ammarcharef06.learnenglish://auth/callback"]
site_url = "http://localhost:3000"

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false
