<!DOCTYPE html>
<html lang="ar" dir="rtl" data-zero="a0">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>من الصفر — تأسيس A0 · أكاديمية الإنجليزية</title>
  <meta name="description" content="قسم «من الصفر» (A0): الأبجدية، والأرقام الأساسية، وأيام الأسبوع، والضمائر، والتحيات البسيطة — مع نطق عربي ولوح كتابة واختبار وشهادة." />
  <meta name="theme-color" content="#050607" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="من الصفر A0" />

  <!-- تطبيق مستقل: بيان التثبيت خاص بهذه الصفحة -->
  <link rel="manifest" href="./manifest-zero.webmanifest" />
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- واجهة موحدة مع إضافات التأسيس A0 -->
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/zero.css" />
  <link rel="stylesheet" href="./assets/css/zero-pad.css" />

  <script>
    /* نفس تهيئة الموقع: السمة والستايل قبل رسم الصفحة بلا وميض */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('lea.settings.v1') || '{}');
        var theme = s.theme || 'dark';
        var dark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.skin = 'nocturne';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.uiLang = 'ar';
        document.documentElement.dataset.zero = 'a0';
        document.documentElement.dataset.contrast = s.highContrast ? 'high' : 'normal';
        document.documentElement.dataset.reduceMotion = s.reduceAnimations ? 'true' : 'false';
        if (s.fontSize) document.documentElement.style.setProperty('--font-scale', String(s.fontSize / 100));
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.dataset.zero = 'a0';
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">تخطَّ إلى المحتوى</a>

  <!-- نفس هيكل الموقع: شريط علوي + محتوى — بلا قائمة مستويات ولا أي عنصر من موقع المستويات -->
  <div id="app" class="app">
    <header class="topbar" id="topbar"></header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="قائمة قسم من الصفر">
        <div class="sidebar__inner">
          <nav class="sidenav" id="sidenav"></nav>
        </div>
      </aside>

      <main class="view" id="view" tabindex="-1">
        <div class="card"><div class="empty"><span class="ico">🌱</span><p>جارٍ تحضير قسم «من الصفر»…</p></div></div>
        <noscript><div class="card">هذه الصفحة تحتاج تشغيل JavaScript في المتصفح.</div></noscript>
      </main>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <nav class="mobile-nav" id="bottomnav" aria-label="التنقل في قسم التأسيس"></nav>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script type="module" src="./assets/js/zero-main.js"></script>
</body>
</html>
