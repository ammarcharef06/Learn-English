<!DOCTYPE html>
<html lang="ar" dir="rtl" data-zero="a0">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>من الصفر — تأسيس A0 · أكاديمية الإنجليزية</title>
  <meta name="description" content="قسم «من الصفر» (A0): الحروف وأصواتها، الحروف المركّبة، الأرقام، الوقت، الضمائر، ١٢٠ كلمة، ٤٠ جملة، وقراءات أولى — بنطق عربي ولوح كتابة واختبار وشهادة." />
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#23272f" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="من الصفر A0" />

  <!-- تطبيق مستقل: بيان التثبيت خاص بهذه الصفحة -->
  <link rel="manifest" href="./manifest-zero.webmanifest" />
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- نفس نظام التصميم والستايلات، ثم أنماط قسم A0 ولوح الكتابة -->
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/skins/gnome.css" />
  <link rel="stylesheet" href="./assets/css/skins/kali.css" />
  <link rel="stylesheet" href="./assets/css/zero.css" />
  <link rel="stylesheet" href="./assets/css/zero-pad.css" />

  <script>
    /* هذه الصفحة هي قسم A0 نفسه: نثبّت السمة والستايل قبل الرسم بلا وميض */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('lea.settings.v1') || '{}');
        var theme = s.theme || 'auto';
        var dark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var skin = s.skin || 'kali';
        document.documentElement.dataset.skin = skin;
        if (skin === 'kali') dark = true;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.uiLang = 'ar';
        document.documentElement.dataset.zero = 'a0';
        if (s.fontSize) document.documentElement.style.setProperty('--font-scale', String(s.fontSize / 100));
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.zero = 'a0';
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">تخطَّ إلى المحتوى</a>

  <!-- شريط قسم A0 الخاص (لا يوجد هنا شريط الموقع ولا قائمته الجانبية) -->
  <header class="zbar" id="zbar"></header>

  <main class="zview" id="view" tabindex="-1">
    <div class="zpage"><div class="znotice">جارٍ تحضير قسم «من الصفر»…</div></div>
    <noscript><p class="znotice">هذه الصفحة تحتاج تشغيل JavaScript في المتصفح.</p></noscript>
  </main>

  <nav class="znav" id="znav" aria-label="تنقل قسم من الصفر"></nav>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="./assets/js/config.js"></script>
  <script type="module" src="./assets/js/zero-main.js"></script>
</body>
</html>
